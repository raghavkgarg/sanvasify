<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanvasify - Check SIF NAV</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="sif-card">
    <div class="guide-container">
      <div class="welcome-block">
        <div class="branding-group">
          <img src="images/Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
          <div class="welcome-text">
            <h1>Check SIF NAV</h1>
            <p class="subhead">Real-time Net Asset Value for your investment portfolio</p>
          </div>
        </div>
        <div class="nav-links-info">
          <a href="index.html" class="nav-badge-link"><div class="nav-badge"><strong>🏠 Home</strong></div></a>
          <a href="nav_trends.html" class="nav-badge-link"><div class="nav-badge"><strong>📈 Trends</strong></div></a>
          <a href="compare.html" class="nav-badge-link"><div class="nav-badge"><strong>⚖️ Compare</strong></div></a>
        </div>
      </div>

      <main>
        <div class="search-section advanced-search">
          <div class="advanced-layout">
            <div class="filters-column">
              <div class="header-group">
                <span class="section-title block">Advanced Filter</span>
              </div>
              <div class="filters-container">
                <div>
                  <label>Fund Strategy</label>
                  <select id="filter-strategy">
                    <option value="">All Strategies</option>
                  </select>
                </div>
                <div>
                  <label>Fund Company</label>
                  <select id="filter-company">
                    <option value="">All Companies</option>
                  </select>
                </div>
                <div>
                  <label>Distribution Mode</label>
                  <select id="filter-dist-mode">
                    <option value="">All Options</option>
                  </select>
                </div>
                <div class="filter-actions mt-2">
                  <button id="btn-reset-filters" class="btn-primary w-full">Reset Filters</button>
                </div>
              </div>
            </div>

            <div class="results-column">
              <div class="search-section--inline">
                <span class="section-title block">Quick Search</span>
                <label for="scheme-select">Select Scheme:</label>
                <select id="scheme-select">
                  <option value="" disabled selected>Loading schemes...</option>
                </select>
              </div>

              <div id="result-card" class="card card--compact" style="display: none;">
                <h2 id="scheme-name">Scheme Name</h2>
                <div class="detail-row">
                  <span class="label">Net Asset Value</span>
                  <span class="value" id="nav-value">--</span>
                </div>
                <div class="detail-row">
                  <span class="label">Valuation Date</span>
                  <span class="value" id="nav-date">--</span>
                </div>
                <div class="detail-row">
                  <span class="label">Scheme Code</span>
                  <span class="value" id="scheme-code">--</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="trends-container">
          <div id="chart-container"></div>
          <div id="stats-card" class="stats-vertical" style="display: none;">
            <span class="section-title block mb-4">Performance Metrics</span>
            <div class="stats-vertical-list">
              <div class="stat-box">
                <span class="stat-label">Current NAV</span>
                <div class="stat-value" id="current-nav">--</div>
              </div>
              <div class="stat-box">
                <span class="stat-label">All-Time High</span>
                <div class="stat-value" id="highest-nav">--</div>
              </div>
              <div class="stat-box">
                <span class="stat-label">All-Time Low</span>
                <div class="stat-value" id="lowest-nav">--</div>
              </div>
              <div class="stat-box">
                <span class="stat-label">Absolute Change</span>
                <div class="stat-value" id="nav-change">--</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>

  <script type="module">
    import { initNavigation } from './js/navigation.js';
    initNavigation('nav.html');
  </script>
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
