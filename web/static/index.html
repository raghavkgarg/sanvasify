<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanvasify - Mutual Fund NAV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="brand-container">
        <img src="sanvasify.png" alt="Sanvasify Logo" class="brand-logo">
        <span class="brand-name">Sanvasify</span>
    </div>
    <div class="container">
        <header>
            <h1>Specialized Investment Fund</h1>
            <p>Check the latest Net Asset Value for your schemes</p>
        </header>

        <main>
            <div class="search-section">
                <label for="scheme-select">Select Scheme:</label>
                <select id="scheme-select">
                    <option value="" disabled selected>Loading schemes...</option>
                </select>
            </div>

            <div id="result-card" class="card" style="display: none;">
                <h2 id="scheme-name">Scheme Name</h2>
                <div class="detail-row">
                    <span class="label">Net Asset Value:</span>
                    <span class="value" id="nav-value">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Date:</span>
                    <span class="value" id="nav-date">--</span>
                </div>
                <div class="detail-row">
                    <span class="label">Scheme Code:</span>
                    <span class="value" id="scheme-code">--</span>
                </div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
