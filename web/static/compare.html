<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanvasify - Compare SIF Schemes</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="sif-card">
    <div class="guide-container">
      <div class="welcome-block">
        <div class="branding-group">
          <img src="images/Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
          <div class="welcome-text">
            <h1>Compare SIF Schemes</h1>
            <p class="subhead">Side-by-side performance comparison across strategies</p>
          </div>
        </div>
        <a href="index.html" class="home-btn">← Home</a>
      </div>

      <main>
        <div class="compare-tabs">
          <button class="compare-tab active" data-strategy="">All</button>
          <button class="compare-tab" data-strategy="Hybrid">Hybrid Long-Short</button>
          <button class="compare-tab" data-strategy="Equity">Equity</button>
        </div>

        <div class="compare-toolbar">
          <input type="text" id="compare-search" class="compare-search" placeholder="🔍 Search fund or company..." />
          <span class="compare-date" id="compare-date"></span>
        </div>

        <div class="table-responsive">
          <table class="compare-table" id="compare-table">
            <thead>
              <tr>
                <th data-sort="name">Fund Name</th>
                <th data-sort="company">Company</th>
                <th data-sort="nav">NAV</th>
                <th data-sort="annualised">Annualised</th>
                <th data-sort="1m">1M</th>
                <th data-sort="3m">3M</th>
                <th>Compare</th>
              </tr>
            </thead>
            <tbody id="compare-body"></tbody>
          </table>
        </div>

        <div id="compare-panel" class="compare-panel" style="display: none;">
          <div class="compare-panel-header">
            <span>📊 Comparison</span>
            <button id="close-compare" class="btn-primary">✕ Close</button>
          </div>
          <div id="compare-chart" style="width: 100%; height: 280px;"></div>
        </div>
      </main>
    </div>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>

  <script type="module">
    import { initNavigation } from './js/navigation.js';
    initNavigation('compare.html');
  </script>
  <script src="js/theme.js"></script>
  <script type="module" src="js/compare.js"></script>
</body>
</html>
