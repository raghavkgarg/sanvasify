<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <title>Login — Sanvasify</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <h1>Sanvasify</h1>
    <p class="login-subtitle">Sign in to continue</p>
    <button class="login-btn" onclick="login('google')">
      <img src="images/google.svg" alt="" /> Sign in with Google
    </button>
    <button class="login-btn" onclick="login('github')">
      <img src="images/github.svg" alt="" /> Sign in with GitHub
    </button>
  </div>
  <script src="js/theme.js?v=1.0.0"></script>
  <script src="js/login.js?v=1.0.0"></script>
</body>
</html>
