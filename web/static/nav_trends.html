<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NAV Trends - Sanvasify</title>
        <link rel="stylesheet" href="css/style.css?v=1.0.2" />
        <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
        <style>
            @media (max-width: 768px) {
                #chart-container {
                    height: 320px !important;
                }
                .welcome-block {
                    flex-wrap: wrap;
                    gap: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="sif-card">
            <div class="guide-container">
                <div class="welcome-block">
                    <div class="branding-group">
                        <img src="Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
                        <div class="welcome-text">
                            <h1>NAV Trends</h1>
                            <p class="subhead">Visualizing historical performance and volatility cycles</p>
                        </div>
                    </div>
                    <a href="index.html" class="home-btn">← Home</a>
                </div>

                <main>
                    <div class="search-section">
                        <label for="scheme-select">Select Investment Scheme</label>
                        <select id="scheme-select">
                            <option value="" disabled selected>
                                Loading schemes...
                            </option>
                        </select>
                    </div>

                    <div id="chart-container" style="width: 100%; height: 500px; margin-top: 20px;"></div>
                    
                    <div id="stats-card" style="display: none; margin-top: 2.5rem;">
                        <h3>Performance Metrics</h3>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <span class="stat-label">Current NAV</span>
                                <div class="stat-value" id="current-nav">--</div>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">All-Time High</span>
                                <div class="stat-value" id="highest-nav">--</div>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">All-Time Low</span>
                                <div class="stat-value" id="lowest-nav">--</span>
                            </div>
                            <div class="stat-box">
                                <span class="stat-label">Absolute Change</span>
                                <div class="stat-value" id="nav-change">--</div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="js/navigation.js"></script>
        <script>initNavigation('nav_trends.html');</script>
        <script src="js/trends.js?v=1.0.3"></script>
    </body>
</html>
