<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sanvasify - Check SIF NAV</title>
        <link rel="stylesheet" href="css/style.css?v=1.0.3" />
        <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
    </head>
    <body>
                <div class="welcome-block">
                    <div class="branding-group">
                        <img src="images/Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
                        <div class="welcome-text">
                            <h1>Check SIF NAV</h1>
                            <p class="subhead">Real-time Net Asset Value for your investment portfolio</p>
                        </div>
                    </div>
                    <div id="nav-placeholder"></div>
                </div>

                <main>
                    <div class="search-section advanced-search">
                        <div class="advanced-layout">
                            <!-- Left Side: Advanced Filters -->
                            <div class="filters-column">
                                <span class="section-title">Advanced Filter</span>
                                <div class="filters-container">
                                    <div>
                                        <label>Fund Strategy</label>
                                        <select id="filter-strategy">
                                            <option value="">All Strategies</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Fund Company</label>
                                        <select id="filter-company">
                                            <option value="">All Companies</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Distribution Mode</label>
                                        <select id="filter-dist-mode">
                                            <option value="">All Options</option>
                                        </select>
                                    </div>
                                    <div class="filter-actions">
                                        <button id="btn-reset-filters" class="btn-primary">
                                            Reset Filters
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Side: Quick Search & Result Card -->
                            <div class="results-column">
                                <div class="quick-search-section">
                                    <span class="section-title">Quick Search</span>
                                    <label for="scheme-select">Select Scheme:</label>
                                    <select id="scheme-select">
                                        <option value="" disabled selected>
                                            Loading schemes...
                                        </option>
                                    </select>
                                </div>

                                <!-- Result Card -->
                                <div id="result-card" class="card result-card" style="display: none;">
                                    <h2 id="scheme-name">Scheme Name</h2>
                                    <div class="detail-row">
                                        <span class="label">Net Asset Value</span>
                                        <span class="value" id="nav-value">--</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="label">Valuation Date</span>
                                        <span class="value" id="nav-date">--</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="label">Scheme Code</span>
                                        <span class="value" id="scheme-code">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="trends-container">
                        <div id="chart-container" class="chart-panel"></div>
                        <div id="stats-card" class="stats-panel" style="display: none;">
                            <span class="section-title">Performance Metrics</span>
                            <div class="stats-vertical-list">
                                <div class="stat-box">
                                    <span class="stat-label">Current NAV</span>
                                    <div class="stat-value" id="current-nav">--</div>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">All-Time High</span>
                                    <div class="stat-value" id="highest-nav">--</div>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">All-Time Low</span>
                                    <div class="stat-value" id="lowest-nav">--</div>
                                </div>
                                <div class="stat-box">
                                    <span class="stat-label">Absolute Change</span>
                                    <div class="stat-value" id="nav-change">--</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
        <script type="module" src="js/app.js?v=1.0.4"></script>
    </body>
</html>
