<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f6e9da">
  <!-- Apple/Safari PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIF Analytics">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <meta name="description"
    content="Track live daily NAV updates, historical performance charts, and strategy distribution modes for SEBI Specialised Investment Funds (SIF) in India." />
  <meta name="keywords"
    content="SIF NAV tracker, SIF NAV, SIF investment returns, Specialised Investment Funds NAV, AMFI SIF daily NAV, long-short fund NAV" />
  <title>SIF NAV Tracker & Live Returns Lookup | Sanvasify</title>
  <link rel="canonical" href="https://sanvasify.com/nav.html" />
  <link rel="stylesheet" href="css/design-tokens.css?v=1.0.2" />
  <link rel="stylesheet" href="css/style.css?v=1.0.2" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js" defer></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialProduct",
      "name": "Specialised Investment Fund (SIF) NAV Lookup",
      "description": "Search and filter Indian SIF schemes to view current Net Asset Value and performance history.",
      "feesAndCommissionsSpecification": "https://sanvasify.com/guide.html",
      "currency": "INR",
      "category": "<Specialised Investment Funds>",
      "provider": { "@type": "Organization", "name": "AMFI" },
      "offers": { "@type": "Offer", "description": "Minimum investment ₹10 Lakh" }
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://sanvasify.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "NAV Lookup",
          "item": "https://sanvasify.com/nav.html"
        }
      ]
    }
  </script>
</head>

<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="brand"><span class="brand-logo"></span><span>Sanvasify</span></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="nav.html" class="active">NAV Lookup</a>
        <a href="nav_trends.html">Trends</a>
        <a href="compare.html">Compare</a>
        <a href="analytics.html">Analytics</a>
        <a href="guide.html">Guide</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>NAV Lookup</h1>
      <p>Search and filter SIF schemes to view current NAV</p>
    </div>

    <div class="filters-row">
      <div>
        <label for="filter-strategy">Fund Strategy</label>
        <select id="filter-strategy">
          <option value="">All Strategies</option>
        </select>
      </div>
      <div>
        <label for="filter-company">Fund Company</label>
        <select id="filter-company">
          <option value="">All Companies</option>
        </select>
      </div>
      <div>
        <label for="filter-dist-mode">Distribution Mode</label>
        <select id="filter-dist-mode">
          <option value="">All Options</option>
        </select>
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button id="btn-reset-filters" class="btn btn-ghost" style="width: 70px; height: 25px;">Reset</button>
      </div>
    </div>

    <div>
      <label for="scheme-select">Quick Search — Select Scheme</label>
      <select id="scheme-select">
        <option value="" disabled selected>Loading schemes...</option>
      </select>
    </div>

    <div id="stats-card" style="display:none; margin-top: var(--space-6);">
      <div class="stats-row">
        <div class="stat"><span class="stat-label">Current NAV</span>
          <div class="stat-value" id="current-nav">--</div>
        </div>
        <div class="stat"><span class="stat-label">All-Time High</span>
          <div class="stat-value" id="highest-nav">--</div>
        </div>
        <div class="stat"><span class="stat-label">All-Time Low</span>
          <div class="stat-value" id="lowest-nav">--</div>
        </div>
        <div class="stat"><span class="stat-label">Absolute Change</span>
          <div class="stat-value" id="nav-change">--</div>
        </div>
      </div>
    </div>

    <div id="chart-container" class="chart-container"></div>

    <div id="result-card" class="panel" style="display:none; margin-top: var(--space-6);">
      <h2 id="scheme-name" style="font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-4);"></h2>
      <div class="detail-row"><span class="label">Net Asset Value</span><span class="value" id="nav-value">--</span>
      </div>
      <div class="detail-row"><span class="label">Valuation Date</span><span class="value" id="nav-date">--</span></div>
      <div class="detail-row"><span class="label">Scheme Code</span><span class="value" id="scheme-code">--</span></div>
    </div>


  </main>

  <script src="js/theme.js?v=1.0.2"></script>
  <script type="module" src="js/common.js?v=1.0.5"></script>
  <script type="module" src="js/app.js?v=1.0.2"></script>
</body>

</html>
