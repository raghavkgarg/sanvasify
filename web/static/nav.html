<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sanvasify - Check SIF NAV</title>
        <link rel="stylesheet" href="css/style.css?v=1.0.2" />
        <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
        <style>
            @media (max-width: 768px) {
                #chart-container {
                    height: 350px !important; /* Shorter height for mobile comfort */
                }
                .welcome-block {
                    flex-wrap: wrap;
                    gap: 1rem;
                }
                .filters-column, #stats-card {
                    max-width: 100% !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="sif-card">
            <div class="guide-container">
                <div class="welcome-block">
                    <div class="branding-group">
                        <img src="Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
                        <div class="welcome-text">
                            <h1>Check SIF NAV</h1>
                            <p class="subhead">Real-time Net Asset Value for your investment portfolio</p>
                        </div>
                    </div>
                    <a href="index.html" class="home-btn">← Home</a>
                </div>

                <main>
                    <div class="search-section advanced-search">
                        <div class="advanced-layout" style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start;">
                            <!-- Left Side: Advanced Filters -->
                            <div class="filters-column" style="flex: 1 1 280px; max-width: 340px; display: flex; flex-direction: column; gap: 2rem;">
                                <div class="header-group">
                                    <span class="section-title" style="display: block;">Advanced Filter</span>
                                </div>
                                <div class="filters-container" style="display: flex; flex-direction: column; gap: 1.7rem;">
                                    <div>
                                        <label>Fund Strategy</label>
                                        <select id="filter-strategy" style="width: 100%;">
                                            <option value="">All Strategies</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Fund Company</label>
                                        <select id="filter-company" style="width: 100%;">
                                            <option value="">All Companies</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Distribution Mode</label>
                                        <select id="filter-dist-mode" style="width: 100%;">
                                            <option value="">All Options</option>
                                        </select>
                                    </div>
                                    <div class="filter-actions" style="margin-top: 0.5rem;">
                                        <button id="btn-reset-filters" class="btn-primary" style="width: 100%;">
                                            Reset Filters
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Side: Quick Search & Result Card -->
                            <div class="results-column" style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 1.5rem;">
                                <!-- Embedded Quick Search -->
                                <div class="search-section" style="margin: 0; padding: 0; background: none; border: none; box-shadow: none;">
                                    <span class="section-title" style="display: block;">Quick Search</span>
                                    <label for="scheme-select">Select Scheme:</label>
                                    <select id="scheme-select" style="width: 100%;">
                                        <option value="" disabled selected>
                                            Loading schemes...
                                        </option>
                                    </select>
                                </div>

                                <!-- Result Card -->
                                <div id="result-card" class="card" style="display: none; margin-top: 0; min-height: 180px; padding: 1.25rem;">
                                    <h2 id="scheme-name" style="margin-top: 0; margin-bottom: 1.1rem; font-size: 1.35rem;">Scheme Name</h2>
                                    <div class="detail-row" style="margin-bottom: 0.8rem;">
                                        <span class="label">Net Asset Value</span>
                                        <span class="value" id="nav-value">--</span>
                                    </div>
                                    <div class="detail-row" style="margin-bottom: 0.8rem;">
                                        <span class="label">Valuation Date</span>
                                        <span class="value" id="nav-date">--</span>
                                    </div>
                                    <div class="detail-row" style="margin-bottom: 0;">
                                        <span class="label">Scheme Code</span>
                                        <span class="value" id="scheme-code">--</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="trends-container" style="display: flex; flex-wrap: wrap; gap: 2rem; margin-top: 35px; align-items: flex-start; width: 100%;">
                        <!-- Trend Analysis Chart (Left side) -->
                        <div id="chart-container" style="flex: 2 1 400px; min-width: 0; height: 550px; background: rgba(15, 46, 63, 0.4); border-radius: 12px; border: 1px solid rgba(226, 177, 62, 0.2);"></div>

                        <!-- Performance Stats (Right side, vertically aligned) -->
                        <div id="stats-card" style="display: none; flex: 1 1 280px; max-width: 340px;">
                            <span class="section-title" style="display: block; margin-bottom: 1rem;">Performance Metrics</span>
                            <div class="stats-vertical-list" style="display: flex; flex-direction: column; gap: 1.25rem;">
                                <div class="stat-box" style="background: rgba(15, 46, 63, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid rgba(226, 177, 62, 0.15);">
                                    <span class="stat-label" style="color: #cbd5e6; font-size: 0.85rem; display: block; margin-bottom: 0.4rem;">Current NAV</span>
                                    <div class="stat-value" id="current-nav" style="color: #E2B13E; font-size: 1.4rem; font-weight: 700;">--</div>
                                </div>
                                <div class="stat-box" style="background: rgba(15, 46, 63, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid rgba(226, 177, 62, 0.15);">
                                    <span class="stat-label" style="color: #cbd5e6; font-size: 0.85rem; display: block; margin-bottom: 0.4rem;">All-Time High</span>
                                    <div class="stat-value" id="highest-nav" style="color: #E2B13E; font-size: 1.4rem; font-weight: 700;">--</div>
                                </div>
                                <div class="stat-box" style="background: rgba(15, 46, 63, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid rgba(226, 177, 62, 0.15);">
                                    <span class="stat-label" style="color: #cbd5e6; font-size: 0.85rem; display: block; margin-bottom: 0.4rem;">All-Time Low</span>
                                    <div class="stat-value" id="lowest-nav" style="color: #E2B13E; font-size: 1.4rem; font-weight: 700;">--</div>
                                </div>
                                <div class="stat-box" style="background: rgba(15, 46, 63, 0.6); padding: 1.25rem; border-radius: 12px; border: 1px solid rgba(226, 177, 62, 0.15);">
                                    <span class="stat-label" style="color: #cbd5e6; font-size: 0.85rem; display: block; margin-bottom: 0.4rem;">Absolute Change</span>
                                    <div class="stat-value" id="nav-change" style="font-size: 1.4rem; font-weight: 700;">--</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="js/navigation.js"></script>
        <script>initNavigation('nav.html');</script>
        <script src="js/app.js?v=1.0.3"></script>
    </body>
</html>
