<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sanvasify - Check SIF NAV</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="brand-container">
            <img src="Sanvasify.png" alt="Sanvasify Logo" class="brand-logo" />
        </div>
        <div class="container">
            <header>
                <h1>Check SIF NAV</h1>
                <p>Check the latest Net Asset Value for your schemes</p>
            </header>
            <main>
                <div class="search-section">
                    <label for="scheme-select">Select Scheme:</label>
                    <select id="scheme-select">
                        <option value="" disabled selected>
                            Loading schemes...
                        </option>
                    </select>
                </div>

                <div class="search-section advanced-search">
                    <h2>Advanced Search</h2>
                    <div class="filters-container">
                        <select id="filter-type">
                            <option value="">Select Fund Type</option>
                        </select>
                        <select id="filter-strategy">
                            <option value="">Select Fund Strategy</option>
                        </select>
                        <select id="filter-company">
                            <option value="">Select Fund Company</option>
                        </select>
                        <select id="filter-dist">
                            <option value="">Select Distribution</option>
                        </select>
                        <select id="filter-mode">
                            <option value="">Select Mode</option>
                        </select>
                    </div>
                    <button id="btn-advanced-search" class="btn-primary">
                        Get NAV
                    </button>
                </div>

                <div id="result-card" class="card" style="display: none">
                    <h2 id="scheme-name">Scheme Name</h2>
                    <div class="detail-row">
                        <span class="label">Net Asset Value:</span>
                        <span class="value" id="nav-value">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Date:</span>
                        <span class="value" id="nav-date">--</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Scheme Code:</span>
                        <span class="value" id="scheme-code">--</span>
                    </div>
                </div>
            </main>
        </div>
        <script src="js/navigation.js"></script>
        <script>initNavigation('check_sif_nav.html');</script>
        <script src="js/app.js"></script>
    </body>
</html>
