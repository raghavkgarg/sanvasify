<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sanvasify</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <h1>Login to Sanvasify</h1>
    <button class="login-btn google-btn" onclick="login('google')">
      <img src="images/google.svg" alt="Google" /> Sign in with Google
    </button>
    <button class="login-btn github-btn" onclick="login('github')">
      <img src="images/github.svg" alt="GitHub" /> Sign in with GitHub
    </button>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
