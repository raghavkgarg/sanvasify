<svg width="800" height="560" viewBox="0 0 800 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --color-logo-p1: #1C2B4A;
      --color-logo-p2: #2A8A8C;
      --color-logo-p3: #E4B45F;
      --color-logo-stroke: #ffffff;
      --color-logo-text: #1C2B4A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-logo-p1: #8ea5d1;
        --color-logo-p2: #3EB4B6;
        --color-logo-p3: #E4B45F;
        --color-logo-stroke: #1f2937;
        --color-logo-text: #f9fafb;
      }
    }
    .logo-p1 { fill: var(--color-logo-p1); color: var(--color-logo-p1); }
    .logo-p2 { fill: var(--color-logo-p2); color: var(--color-logo-p2); }
    .logo-p3 { fill: var(--color-logo-p3); color: var(--color-logo-p3); }
    .logo-poly {
      stroke: var(--color-logo-stroke);
      stroke-width: 8px;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }
    .logo-text {
      fill: var(--color-logo-text);
    }
  </style>

  <!-- Third triangle - GOLD (back) -->
  <polygon points="560,60 800,340 320,340" class="logo-poly logo-p3"/>

  <!-- Second triangle - TEAL (middle) -->
  <polygon points="440,80 640,340 240,340" class="logo-poly logo-p2"/>

  <!-- First triangle - DARK NAVY (front) -->
  <polygon points="320,100 480,340 160,340" class="logo-poly logo-p1"/>

  <!-- Main Text: Sanvasify -->
  <text
    x="480"
    y="430"
    font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="108"
    font-weight="900"
    letter-spacing="-2"
    class="logo-text"
    text-anchor="middle">Sanvasify</text>

  <!-- Tagline -->
  <text
    x="490"
    y="485"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    text-anchor="middle">
    <tspan class="logo-p1">Accumulate. </tspan>
    <tspan class="logo-p2">Invest. </tspan>
    <tspan class="logo-p3">Amplify.</tspan>
  </text>
</svg>
