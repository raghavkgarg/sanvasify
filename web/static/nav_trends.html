<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAV Trends — Sanvasify</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="/" class="brand"><span class="brand-logo"></span><span>Sanvasify</span></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
      <div class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="nav.html">NAV Lookup</a>
        <a href="nav_trends.html" class="active">Trends</a>
        <a href="compare.html">Compare</a>
        <a href="analytics.html">Analytics</a>
        <a href="guide.html">Guide</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>NAV Trends</h1>
      <p>Historical performance and volatility visualization</p>
    </div>

    <div style="margin-bottom: var(--space-5);">
      <label for="scheme-select">Select Scheme</label>
      <select id="scheme-select"><option value="" disabled selected>Loading schemes...</option></select>
    </div>

    <div id="chart-container" class="chart-container"></div>

    <div id="stats-card" style="display:none; margin-top: var(--space-6);">
      <div class="stats-row">
        <div class="stat"><span class="stat-label">Current NAV</span><div class="stat-value" id="current-nav">--</div></div>
        <div class="stat"><span class="stat-label">All-Time High</span><div class="stat-value" id="highest-nav">--</div></div>
        <div class="stat"><span class="stat-label">All-Time Low</span><div class="stat-value" id="lowest-nav">--</div></div>
        <div class="stat"><span class="stat-label">Absolute Change</span><div class="stat-value" id="nav-change">--</div></div>
      </div>
    </div>
  </main>

  <script src="js/theme.js?v=1.0.0"></script>
  <script type="module" src="js/common.js?v=1.0.0"></script>
  <script type="module" src="js/trends.js?v=1.0.0"></script>
</body>
</html>
